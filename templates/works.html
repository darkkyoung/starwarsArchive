<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StarTrack - 작품 정보</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>StarTrack</h1>
        <p>Star Wars 콘텐츠 정보·최신 소식 큐레이션 서비스</p>
        <nav>
            <a href="/">최신 소식</a>
            <a href="/works">작품 정보</a>
        </nav>
    </header>

    <main>
        <h2>작품 정보</h2>

        {% if works %}
            <div class="card-container">
                {% for work in works %}
                    <div class="card">
                        <span class="badge">{{ work[2] }}</span>
                        <h3>{{ work[1] }}</h3>
                        <p class="meta">{{ work[3] }} · {{ work[4] }}</p>
                        <p>{{ work[5] }}</p>

                        {% if work[6] %}
                            <a class="source-button" href="{{ work[6] }}" target="_blank">
                                출처 보기
                            </a>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="empty-message">등록된 작품 정보가 없습니다.</p>
        {% endif %}
    </main>
</body>
</html>
